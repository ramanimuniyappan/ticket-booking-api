spring.application.name=ticket-booking-api

spring.datasource.url=jdbc:postgresql://localhost:5432/ticket_booking
spring.datasource.username=${DB_USERNAME:ticket_user}
spring.datasource.password=${DB_PASSWORD:ticket_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

logging.level.org.flywaydb=INFO